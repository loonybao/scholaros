# Official data sources. Collectors are implemented per source (S3+).
# enabled: false until the collector exists and is tested.

sources:
  - id: aalto
    organisation: Aalto University
    type: university-vacancies
    url: https://www.aalto.fi/en/open-positions
    priority: 1
    enabled: true           # collector implemented in S3b
    rate_limit_seconds: 5

  - id: tampere
    organisation: Tampere University
    type: university-vacancies
    url: https://www.tuni.fi/en/tau/work-with-us/open-positions
    priority: 2
    enabled: true           # collector implemented in S3a
    rate_limit_seconds: 5
    notes: English page lists only positions published in English; Finnish-only roles are on the Finnish page.

  - id: tudelft
    organisation: TU Delft
    type: university-vacancies
    url: https://careers.tudelft.nl/go/All-jobs/9021002/
    priority: 1
    enabled: true           # collector implemented in S5a — plain-GET server-rendered SF pages, no cookies needed
    rate_limit_seconds: 10

  - id: euraxess
    organisation: EURAXESS
    type: aggregator
    url: https://euraxess.ec.europa.eu/jobs/search
    priority: 3
    enabled: false          # S13 collector ready; keep disabled until you review the scope, then set true
    rate_limit_seconds: 10
    # Keyword-scoped so a search returns a small relevant set, never the ~9,000
    # full listing. Tune these to your interests; each is one search. The
    # three-way discovery filter still keeps non-research listings out.
    keywords:
      - extended reality
      - human-computer interaction
      - immersive
    max_pages: 2            # pages per keyword (10 results/page)
