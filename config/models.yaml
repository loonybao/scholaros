# LLM configuration. Credentials live in .env (COMPASS_API_KEY / COMPASS_API_BASE_URL).

api:
  # provider: "anthropic" (Claude, via 01tree /claudecode) or "openai-compatible"
  # (GPT, via 01tree /codex/v1). Set COMPASS_API_KEY + COMPASS_API_BASE_URL in .env.
  provider: anthropic
  model: claude-haiku-4-5-20251001   # cheap, strong for semantic fit analysis (~$1/$5 per 1M in/out)
  temperature: 0.2
  max_input_characters: 30000
  max_output_tokens: 4096
  # Per-1M-token USD prices (enables the daily $ cap). Values below are the
  # 01tree Claude Haiku 4.5 list price (input / output). Update if you switch model.
  price_per_1m_input: 1.00
  price_per_1m_output: 5.00
  # GPT alternative (01tree /codex/v1): provider openai-compatible,
  # model gpt-5.4-mini, prices 0.75 / 4.50.

limits:
  daily_cost_limit_usd: 1.00
  max_ai_items_per_run: 20

thresholds:
  # Below this confidence a proposal is never auto-finalized; it goes to manual review.
  confidence_autodecide: 0.75
  # decision=apply is NEVER auto-finalized regardless of confidence (enforced in rules.py).

# LLM context whitelist (enforced in llm.py). ONLY these content classes may be
# sent to the API. Anything not listed is refused at the call site.
context_whitelist:
  - opportunity_official_text
  - signal_official_text
  - organisation_official_text
  - person_official_text
  - taxonomy
  - profile_skill_summary
  - profile_domain_summary
  - target_identity_statement

# Never sent, under any circumstances (tested):
#   vault/notes/*, full private CV, recommendation letters,
#   private correspondence, unpublished manuscript full text.
