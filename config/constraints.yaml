# Hard eligibility constraints. UNKNOWN VALUES STAY null — never invent defaults.
# Any null constraint that a check depends on yields eligibility_gate=uncertain
# and needs_review=true (manual review), never a guess.

# Geographic scope. Confirmed scope: salaried/funded research positions across
# Europe; Finland and the Netherlands are PREFERRED because Aalto and TU Delft
# are primary targets. Preference affects strategic value only — it never
# narrows the eligibility gate. A confirmed European location passes the
# geography check without an exhaustive country whitelist.
geography:
  allowed_regions:
    - Europe
  preferred_countries:
    - Finland
    - Netherlands
  excluded_countries: []

# Earliest realistic start date (ISO date). null = unknown.
earliest_start: null

# Languages I can work in professionally.
languages:
  - English
# Languages I explicitly cannot meet if required (null = unknown).
excluded_language_requirements: null

# Degree I will hold at application time.
degree_held: "MSc by Research"
# Expected thesis completion date (ISO date). null = unknown.
expected_completion: null

# Funding requirement: position must be salaried or fully funded.
requires_funding: true

# Confirmed standing for positions that EXPLICITLY STATE nationality or
# export-control restrictions: "eligible" | "ineligible" | null (unknown —
# such positions go to manual review). Positions with no stated restriction
# are unaffected by this value. Never guessed.
restricted_position_eligibility: null
