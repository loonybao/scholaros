education:
  degree: MSc by Research (in progress, thesis stage)
  institution: Multimedia University (MMU), Faculty of Creative Multimedia
  country: Malaysia
  conventional_cgpa: false

research_summary: >
  Master's research on faculty-level university orientation through a
  human-centred XR application: digital twin of the campus, metaverse
  orientation, gamification. Core mechanism is structured role-dependent
  multiplayer collaboration (information asymmetry, positive interdependence,
  communication, mutual confirmation, role switching). Primary outcomes:
  spatial familiarity and real-world wayfinding performance.

